name: Public 0.1.6 to 0.1.7 update acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-upgrade:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Authentic public installer and installed-app upgrade; no game files
        run: node scripts/verify-public-upgrade.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-upgrade-acceptance
          path: |
            .local/public-upgrade/report.json
            .local/public-upgrade/failure.json
            .local/public-upgrade/public-update-and-download.png
          if-no-files-found: ignore
          retention-days: 7
